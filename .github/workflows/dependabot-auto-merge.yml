# Enables GitHub's auto-merge for Dependabot pull requests of the following kinds:
# - patch updates of production dependencies (also indirect ones)
# - patch and minor updates of development dependencies
# GitHub merges them (squash) when the required checks of main have passed.
# Other updates, e.g. major updates, have to be merged by hand.

name: Auto-Merge Dependabot PRs

on:
  # WARNING: This runs in the PR base with access to the secrets, DO NOT check out or build the PR code here
  # details under https://github.blog/changelog/2021-02-19-github-actions-workflows-triggered-by-dependabot-prs-will-run-with-read-only-permissions/
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the metadata of the update
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: |
          (steps.metadata.outputs.dependency-type != 'direct:development' &&
           steps.metadata.outputs.update-type == 'version-update:semver-patch') ||
          (steps.metadata.outputs.dependency-type == 'direct:development' &&
           (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'))
        # Not "gh pr merge --auto": it merges right away if GitHub reports the pull request as mergeable,
        # which may happen before the checks of a new commit have started. This only enables auto-merge.
        run: |
          gh api graphql \
            -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) { clientMutationId } }' \
            -f id="$PR_ID"
        env:
          PR_ID: ${{ github.event.pull_request.node_id }}
          # a personal access token (Contents and Pull requests: read and write), so the merge triggers the
          # workflows on main, which rebuild the committed build
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
