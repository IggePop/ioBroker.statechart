version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # a random time once a month, to spread the load on GitHub
      interval: cron
      cronjob: "54 5 5 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    # new versions are only proposed after some days, to reduce the risk of compromised packages
    cooldown:
      default-days: 7
    assignees:
      - IggePop
    versioning-strategy: increase
    ignore:
      # @iobroker/adapter-react-v5 requires MUI 6 and React 18 (peer dependencies), so their major updates
      # cannot be installed. Update them together with a new version of @iobroker/adapter-react-v5.
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # The adapter supports Node.js 22: the types must not contain APIs of newer versions
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @typescript-eslint (from @iobroker/eslint-config) does not support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # a random time once a month, to spread the load on GitHub
      interval: cron
      cronjob: "29 5 10 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - IggePop
